[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retailiq"
version = "1.0.0"
description = "RetailIQ: AI-Powered E-commerce Data Lakehouse & Multi-Agent Analytics Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.25",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.4.0",
    "openpyxl>=3.1.2",
    "requests>=2.31.0",
    "python-multipart>=0.0.6",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests/unit",
    "agent_runtime/tests",
]
pythonpath = [
    "src",
    ".",
]
