name: 'dbt_retailiq'
version: '1.0.0'
config-version: 2

profile: 'retailiq'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_retailiq:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
